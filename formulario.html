<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agendar atendimento | PetAmigo Petshop</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="comum.css">
<link rel="stylesheet" href="formulario.css">
</head>
<body>
<main class="pagina">
  <h1>Agendar atendimento</h1>
  <p>Preencha os dados do seu pet. Todos os campos são obrigatórios.</p>

  <!-- novalidate: as mensagens de erro são as nossas (feitas no formulario.js) -->
  <form class="formulario" id="formAgendamento" novalidate>

    <div class="campo">
      <label for="servico">Serviço</label>
      <select id="servico" name="servico" aria-describedby="erro-servico">
        <option value="">Escolha...</option>
        <option value="hotel">Hotelzinho</option>
        <option value="banho-tosa">Banho e tosa</option>
        <option value="veterinario">Veterinário (hospital)</option>
      </select>
      <p class="erro" id="erro-servico" role="alert"></p>
    </div>

    <div class="campo">
      <label for="tutor">Nome do tutor</label>
      <input type="text" id="tutor" name="tutor" autocomplete="name" aria-describedby="erro-tutor">
      <p class="erro" id="erro-tutor" role="alert"></p>
    </div>

    <div class="campo">
      <label for="animal">Nome do animal</label>
      <input type="text" id="animal" name="animal" aria-describedby="erro-animal">
      <p class="erro" id="erro-animal" role="alert"></p>
    </div>

    <div class="campo">
      <label for="raca">Raça do animal</label>
      <input type="text" id="raca" name="raca" aria-describedby="erro-raca">
      <p class="erro" id="erro-raca" role="alert"></p>
    </div>

    <div class="campo">
      <label for="peso">Peso do animal (kg)</label>
      <input type="number" id="peso" name="peso" step="0.1" min="0.1" max="100" inputmode="decimal" aria-describedby="erro-peso">
      <p class="erro" id="erro-peso" role="alert"></p>
    </div>

    <div class="campo">
      <label for="telefone">Telefone para contato</label>
      <input type="tel" id="telefone" name="telefone" placeholder="(81) 91234-5678" autocomplete="tel" aria-describedby="dica-telefone erro-telefone">
      <p class="dica" id="dica-telefone">DDD e 9 dígitos</p>
      <p class="erro" id="erro-telefone" role="alert"></p>
    </div>

    <div class="campo">
      <label for="data">Data</label>
      <input type="date" id="data" name="data" aria-describedby="erro-data">
      <p class="erro" id="erro-data" role="alert"></p>
    </div>

    <div class="campo">
      <label for="horario">Horário</label>
      <input type="time" id="horario" name="horario" aria-describedby="erro-horario">
      <p class="erro" id="erro-horario" role="alert"></p>
    </div>

    <div class="acoes">
      <button type="submit" class="botao" id="btnEnviar">Agendar</button>
      <a class="botao botao--claro" href="agendamentos.html">Voltar</a>
    </div>
  </form>
</main>
<script src="comum.js"></script>
<script src="formulario.js"></script>
</body>
</html>
